name: Deploy

# One pipeline, not two: deploying the backend also deploys the built
# frontend, since they are served from the same Worker (architecture 6.3).
# Runs on every push to main. workflow_dispatch lets you trigger it by hand
# from the Actions tab, e.g. after a manual D1 change.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Safe to run on every deploy: this command tracks which migrations
      # have already been applied and only runs new ones (see PHASE2_DEPLOY.md).
      - name: Apply D1 migrations
        working-directory: backend
        run: npx wrangler d1 migrations apply villoguides --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
