# Cloudflare Worker configuration (architecture 6.2, 6.3, 7.1).
# The [[d1_databases]] and [[r2_buckets]] "database_id" and nothing-needed-for-R2
# below are placeholders. Run the commands in the Phase 2 README section to
# create the real resources, then paste the IDs wrangler prints back here.

name = "villoguides"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Routes on the real domain. Both the root domain and every subdomain hit this
# one Worker; src/index.ts decides what to render from the hostname.
routes = [
  { pattern = "villoguides.com/*", zone_name = "villoguides.com" },
  { pattern = "*.villoguides.com/*", zone_name = "villoguides.com" },
]

[[d1_databases]]
binding = "DB"
database_name = "villoguides"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "villoguides-photos"

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ROOT_DOMAIN = "villoguides.com"
STUDIO_OWNER_EMAIL = "owner@villoguides.com"

[triggers]
# Filled in during Phase 5 (architecture 13.4): daily version check, weekly
# orphaned-photo cleanup, weekly D1 backup, daily intake link expiry.
crons = []
