# Cloudflare Worker configuration (architecture 6.2, 6.3, 7.1).

name = "villoguides"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Routes on the real domain. Both the root domain and every subdomain hit this
# one Worker; src/index.ts decides what to render from the hostname.
routes = [
  { pattern = "villoguides.com/*", zone_name = "villoguides.com" },
  { pattern = "*.villoguides.com/*", zone_name = "villoguides.com" },
]

[[d1_databases]]
binding = "DB"
database_name = "villoguides"
database_id = "1f4009ec-8a17-4e40-9f11-d68545f6e972"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "villoguides-photos"

# Rate limiting (architecture 12). No separate Cloudflare resource to
# create; these provision automatically on deploy. namespace_id is just an
# integer you choose, unique within this account. Period must be 10 or 60.
[[unsafe.bindings]]
name = "RL_STANDARD"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 10 }

[[unsafe.bindings]]
name = "RL_REPORT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Private-block PIN unlock (architecture 12). Much tighter than the two
# above: a 4-digit PIN is only 10,000 possibilities, so this needs to be
# tight enough that guessing it is impractical, not just "not spammy."
[[unsafe.bindings]]
name = "RL_UNLOCK"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, Cloudflare serves any matching static file directly and the
# Worker's own fetch handler never runs at all for it, which is exactly the
# case for every HTML document request (including "/", which matches
# index.html literally). That silently made the CSP-wrapping catch-all
# route in index.ts unreachable for the very requests it exists to handle.
# Scoped to exclude /assets/*, where every built JS/CSS/font file lives, so
# this doesn't add a database lookup to every sub-resource on a page, only
# to actual document-level navigations.
run_worker_first = ["/*", "!/assets/*"]

[vars]
ROOT_DOMAIN = "villoguides.com"
STUDIO_OWNER_EMAIL = "owner@villoguides.com"

# Online payments (architecture "Later" list). These five are secrets, not
# plain vars: never put real values in this file. Set each with:
#   npx wrangler secret put XENDIT_SECRET_KEY
#   npx wrangler secret put XENDIT_WEBHOOK_TOKEN
#   npx wrangler secret put PAYPAL_CLIENT_ID
#   npx wrangler secret put PAYPAL_CLIENT_SECRET
#   npx wrangler secret put PAYPAL_WEBHOOK_ID
# PAYPAL_API_BASE is the one exception, safe as a plain var since it holds
# no credential, only which of PayPal's two environments to call:
PAYPAL_API_BASE = "https://api-m.sandbox.paypal.com"

# Notification email (architecture 6.2, 6.4). Optional: unset means every
# notification call silently does nothing, matching "optional at launch."
#   npx wrangler secret put RESEND_API_KEY

[triggers]
# Architecture 13.4. Times are UTC; chosen to land in the small hours in the
# Philippines. The exact minute of each just keeps the four jobs from firing
# in the same instant, nothing more significant than that.
crons = [
  "0 18 * * *",   # daily: verify every published guide has a valid current version
  "15 18 * * *",  # daily: expire intake links past expires_at
  "30 18 * * 7",  # weekly (Sunday): delete orphaned photos in R2
  "45 18 * * 7",  # weekly (Sunday): export D1 to a private backup location
]
